<!DOCTYPE html> <!-- tells the browser this is modern HTML5 -->
<html lang="en"> <!-- root element; lang helps screen readers pronounce things -->
<head> <!-- invisible setup stuff -->
  <meta charset="UTF-8"> <!-- text encoding so every character displays right -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- fits the page to the device width -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png"> <!-- tab icon -->

  <title>Frontend Mentor | QR code component</title> <!-- tab title -->

  <link rel="stylesheet" href="styles.css"> <!-- loads YOUR css; replaces the starter's <style> block -->
</head>
<body> <!-- everything visible -->

  <main class="page"> <!-- the main-content landmark; .page is your hook for centering -->
    <div class="qr-card"> <!-- the white card -->

      <img class="qr-image" src="./images/image-qr-code.png" alt="QR code that links to the Frontend Mentor website"> <!-- QR code; alt says where it leads -->

      <h1 class="qr-title">Improve your front-end skills by building projects</h1> <!-- the only heading, so h1 -->

      <p class="qr-text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p> <!-- supporting text -->

    </div> <!-- end card -->
  </main> <!-- end main -->

  <footer class="attribution"> <!-- credits; keeps the starter's class name -->
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. <!-- challenge credit -->
    Coded by <a href="https://guerz.lol">Guerz</a>. <!-- your credit -->
  </footer> <!-- end footer -->
</body> <!-- end visible page -->
</html> <!-- end document -->
